<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>IP 域名信息查询 - NetScope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="查询IP地址和域名的详细信息，包括地理位置、运营商等。" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" href="https://fav.farm/🌐" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="styles.css" />
    <script>
        // 国内 IP 查询接口。getResultData 会自动追加 ?ip=当前出口 IP。
        window.NETSCOPE_CONFIG = {
            domesticIpApiUrl: 'https://ip9.com.cn/get'
        };
    </script>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i data-lucide="activity" class="nav-icon"></i>
                <h1 class="nav-title">NetScope<span class="accent">Query</span></h1>
            </div>
            <button id="refresh-btn" class="icon-btn" title="刷新数据">
                <i data-lucide="refresh-cw"></i>
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- IP Overview Cards -->
        <div class="ip-cards-grid">
            <!-- Global IP Card -->
            <div class="ip-card">
                <div class="card-icon-bg">
                    <i data-lucide="globe" class="card-icon"></i>
                </div>
                <h2 class="card-label">全球互联网 IP</h2>
                <div id="user-ip" class="card-value loading-shimmer">加载中...</div>
            </div>

            <!-- Domestic IP Card -->
            <div class="ip-card">
                <div class="card-icon-bg domestic">
                    <i data-lucide="map-pin" class="card-icon"></i>
                </div>
                <h2 class="card-label">国内 IP 地址</h2>
                <div id="result" class="card-value loading-shimmer">加载中...</div>
            </div>

            <!-- Exit Node Card -->
            <div class="ip-card">
                <div class="card-icon-bg exit">
                    <i data-lucide="shield" class="card-icon"></i>
                </div>
                <h2 class="card-label">谷歌服务节点</h2>
                <div id="blocked-site-ip" class="card-value loading-shimmer">加载中...</div>
            </div>
        </div>

        <!-- Map & Query Section -->
        <div class="map-section">
            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-wrapper">
                    <i data-lucide="search" class="search-icon"></i>
                    <input 
                        type="text" 
                        id="domain-input" 
                        list="history-list" 
                        placeholder="输入域名 (如 google.com) 或 IP 地址进行追踪..."
                        class="search-input"
                    />
                    <datalist id="history-list"></datalist>
                </div>
                <button id="submit-btn" class="search-btn">
                    <i data-lucide="navigation"></i>
                    <span>追踪</span>
                </button>
            </div>

            <!-- Query Result -->
            <div id="query-result-container" class="query-result"></div>

            <!-- IP Quality Detection (moved between query and map) -->
            <div class="quality-section">
                <div class="section-header compact">
                    <div class="section-title">
                        <i data-lucide="shield-check"></i>
                        <h2>IP 质量检测</h2>
                        <span class="section-note">娱乐向检测，不作严格判断</span>
                    </div>
                </div>

                <div class="quality-content compact">
                    <div class="purity-bar-card">
                        <div class="purity-top-row">
                            <div class="score-label" id="purity-level">评级：检测中...</div>
                            <div class="score-value" id="purity-score">--</div>
                        </div>
                        <div class="purity-progress" id="purity-progress">
                            <div class="purity-progress-fill" id="purity-progress-fill"></div>
                        </div>
                        <div class="purity-scale">
                            <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
                        </div>

                    </div>

                    <div class="quality-attr-card">
                        <div class="badge-label ip-attr-title">IP属性</div>
                        <div class="network-meta-row">
                            <div class="status-badge neutral" id="ip-origin-badge">来源检测中...</div>
                            <div class="status-badge neutral" id="network-type-badge">类型检测中...</div>
                        </div>
                        <div class="asn-text" id="asn-text">ASN: 检测中...</div>
                    </div>

                    <div class="quality-metric-card">
                        <div class="metric-list">
                            <div class="metric-row">
                                <div class="metric-head">
                                    <span>置信度</span>
                                    <span id="confidence-score-text">--</span>
                                </div>
                                <div class="metric-bar metric-confidence">
                                    <div class="metric-fill" id="confidence-progress-fill"></div>
                                </div>
                            </div>

                            <div class="metric-row">
                                <div class="metric-head">
                                    <span>污染度(越低越好)</span>
                                    <span id="impurity-score-text">--</span>
                                </div>
                                <div class="metric-bar metric-impurity">
                                    <div class="metric-fill" id="impurity-progress-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div class="map-wrapper">
                <div id="map-container"></div>
            </div>
        </div>

        <!-- Global Service Connectivity -->
        <div class="connectivity-section">
            <div class="section-header">
                <div class="section-title">
                    <i data-lucide="activity"></i>
                    <h2>全球服务连通性</h2>
                </div>
                <button id="retest-btn" class="retest-btn">
                    <i data-lucide="refresh-cw"></i>
                    <span>重新测试</span>
                </button>
            </div>
            
            <div class="service-grid" id="service-grid">
                <!-- Services will be dynamically loaded here -->
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-curve/leaflet.curve.js"></script>
    <script src="scripts.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
